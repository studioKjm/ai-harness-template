  #   name: AI Security Gate (Isolated Agent)
  #   runs-on: self-hosted          # your machine with Claude Code installed
  #   needs: default-gates
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #
  #     - name: AI Security Analysis
  #       run: bash .harness/gates/check-security-ai.sh . --full-scan
  #       # claude -p uses the local Pro/Max session — no ANTHROPIC_API_KEY needed

  # ── Option B: GitHub-hosted runner (ANTHROPIC_API_KEY required) ──────
