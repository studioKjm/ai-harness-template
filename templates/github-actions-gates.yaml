# GitHub Actions workflow for AI Harness gates
# Copy this to .github/workflows/harness-gates.yaml in your project
#
# Gate tiers:
#   DEFAULT (always run): secrets, boundaries, structure, spec, layers, security, deps
#   OPT-IN (commented out below): complexity, mutation, performance, ai-antipatterns
#   AI SECURITY (separate job, commented out): isolated Claude agent, blocks on critical/high
#     → Requires ANTHROPIC_API_KEY secret. See ai-security-gate job below.

name: Harness Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  default-gates:
    name: Default Gates (Blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets
        run: bash .harness/gates/check-secrets.sh .

      - name: Boundaries
        run: bash .harness/gates/check-boundaries.sh .

      - name: Structure
        run: bash .harness/gates/check-structure.sh .

      - name: Layers
        run: bash .harness/gates/check-layers.sh .

      - name: Security (SAST)
        run: bash .harness/gates/check-security.sh .

      - name: Dependencies
        run: bash .harness/gates/check-deps.sh .

      - name: Spec completeness
        run: |
          if [ -d ".harness/ouroboros/seeds" ]; then
            bash .harness/gates/check-spec.sh .
          else
            echo "::notice::No seeds found — skipping spec gate."
          fi

  # ──────────────────────────────────────────────────────────────
  # OPT-IN GATES — uncomment to enable
  # Typically slower, more opinionated, or project-specific.
  # ──────────────────────────────────────────────────────────────
  # opt-in-gates:
  #   name: Opt-in Gates (Warning)
  #   runs-on: ubuntu-latest
  #   continue-on-error: true
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #
  #     - name: Complexity
  #       run: bash .harness/gates/check-complexity.sh .
  #
  #     - name: Performance budgets
  #       run: bash .harness/gates/check-performance.sh .
  #
  #     - name: AI anti-patterns
  #       run: bash .harness/gates/check-ai-antipatterns.sh .
  #
  #     - name: Mutation testing
  #       run: bash .harness/gates/check-mutation.sh . --threshold=60

  # ──────────────────────────────────────────────────────────────
  # AI SECURITY GATE — separate job (blocking, not warning-only)
  #
  # Spawns a fresh Claude process with zero coding-session context
  # to eliminate confirmation bias in vulnerability detection.
  # Blocks the workflow on critical/high severity findings.
  #
  # WHY SEPARATE FROM opt-in-gates:
  #   opt-in-gates uses continue-on-error: true (warning only).
  #   This gate exits 1 on critical/high — it must be a blocking job.
  #
  # ── AUTH OPTIONS (choose one) ─────────────────────────────────
  #
  # Option A — Self-hosted runner (RECOMMENDED, no API key needed)
  #   Claude Code Pro/Max session is already present on your machine.
  #   1. Register your machine as a GitHub Actions runner:
  #      GitHub repo → Settings → Actions → Runners → New self-hosted runner
  #   2. Uncomment Option A job below.
  #   Cost: $0 (uses your existing Pro/Max subscription)
  #
  # Option B — GitHub-hosted runner (requires ANTHROPIC_API_KEY secret)
  #   1. Settings → Secrets and variables → Actions → New secret
  #      Name: ANTHROPIC_API_KEY
  #   2. Uncomment Option B job below.
  #   Cost: ~$0.01–0.10 per scan (claude-opus-4-7, 50 files / 80KB cap)
  # ──────────────────────────────────────────────────────────────

  # ── Option A: Self-hosted runner (Pro/Max subscription, no API key) ──
